name: test and build backend and frontend of LeagueProject
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend_build:
    defaults:
      run:
        working-directory: backend/

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B test

  frontend_build:
    defaults:
      run:
        working-directory: frontend/

    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
        - name: Use Node.js '24'
          uses: actions/setup-node@v4

          with:
            node-version: '24.21.0'
            cache: 'npm'
            cache-dependency-path: frontend/package-lock.json
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - run: npm install -g npm@11.4.2
        - run: npm ci
        - run: npm run build
        - run: npm test

